name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: carbono-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Restore, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Verify prerequisites
        run: |
          dotnet --version
          docker version

      - name: Prepare optional PR test failure
        if: ${{ github.event_name == 'pull_request' && vars.PHASE6_VERIFY_CI_FAILURE == 'true' }}
        shell: bash
        run: |
          cat > Web.Fiap.Carbono.Tests/Phase6CiFailureVerificationTest.cs <<'CS'
          namespace Web.Fiap.Carbono.Tests;

          public sealed class Phase6CiFailureVerificationTest
          {
              [Fact]
              public void ControlledFailureRetainsReportsAndBlocksDelivery()
              {
                  Assert.Fail("Controlled Phase 6 PR failure; disable PHASE6_VERIFY_CI_FAILURE after collecting evidence.");
              }
          }
          CS

      - name: Restore dependencies
        id: restore
        run: dotnet restore Web.Fiap.Carbono.sln

      - name: Build solution
        id: build
        run: dotnet build Web.Fiap.Carbono.sln --configuration Release --no-restore

      - name: Run tests
        id: tests
        run: |
          dotnet test Web.Fiap.Carbono.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=ci.trx" \
            --results-directory ./artifacts/test-results/ci

      - name: Write CI diagnostic summary
        if: ${{ !cancelled() }}
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p artifacts/ci
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Run: %s\n' "$GITHUB_RUN_ID"
            printf 'Restore: %s\n' "$RESTORE_OUTCOME"
            printf 'Build: %s\n' "$BUILD_OUTCOME"
            printf 'Tests: %s\n' "$TEST_OUTCOME"
          } > artifacts/ci/summary.txt

          if [[ "$TEST_OUTCOME" == "success" ]]; then
            test -s artifacts/test-results/ci/ci.trx
          fi

      - name: Upload CI results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-results
          path: |
            artifacts/ci/summary.txt
            artifacts/test-results/ci/*.trx
          retention-days: 14
          if-no-files-found: error

  image:
    name: Build and publish application image
    needs: ci
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build application image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            --file Dockerfile \
            --tag "${DOCKERHUB_USERNAME}/web-fiap-carbono:${GITHUB_SHA}" \
            .

      - name: Publish application image
        id: publish
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          CARBONO_IMAGE="${DOCKERHUB_USERNAME}/web-fiap-carbono:${GITHUB_SHA}"

          docker push "$CARBONO_IMAGE" \
            | tee "$RUNNER_TEMP/carbono-push.log"

          CARBONO_DIGEST="$(
            sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) .*$/\1/p' \
              "$RUNNER_TEMP/carbono-push.log"
          )"

          if [[ ! "$CARBONO_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Docker push did not return a valid registry digest\n' >&2
            exit 1
          fi

          printf 'digest=%s\n' "$CARBONO_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'Published commit %s with registry digest %s\n' \
            "$GITHUB_SHA" "$CARBONO_DIGEST"

  deploy_staging:
    name: Deploy and verify staging
    needs: image
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, x64, carbono-deploy]
    timeout-minutes: 10

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Deploy staging by published digest
        shell: bash
        env:
          CARBONO_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail

          bash scripts/deploy.sh \
            carbono-staging \
            /home/ubuntu/carbono/staging/staging.env \
            "gui2506/web-fiap-carbono@${CARBONO_DIGEST}" \
            http://127.0.0.1:8081/api/empresas

      - name: Verify controlled staging database failure
        if: ${{ vars.PHASE6_VERIFY_STAGING_FAILURE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase6
          bash scripts/phase6-staging-failure.sh --verify \
            2>&1 | tee artifacts/phase6/staging-failure.txt

      - name: Retain controlled staging failure evidence
        if: ${{ !cancelled() && vars.PHASE6_VERIFY_STAGING_FAILURE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase6-staging-failure
          path: artifacts/phase6/staging-failure.txt
          retention-days: 14
          if-no-files-found: warn

  deploy_production:
    name: Deploy and verify production
    needs: [image, deploy_staging]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, x64, carbono-deploy]
    timeout-minutes: 10

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Deploy production by published digest
        shell: bash
        env:
          CARBONO_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail

          bash scripts/deploy.sh \
            carbono-production \
            /home/ubuntu/carbono/production/production.env \
            "gui2506/web-fiap-carbono@${CARBONO_DIGEST}" \
            http://127.0.0.1:8082/api/empresas
